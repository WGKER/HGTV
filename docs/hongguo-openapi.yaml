openapi: 3.0.3

info:
  title: hongguoTV 接口
  version: "1.0.0"
  description: 本地内容服务（家庭网络协议）与上游红果短剧平台接口。
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: http://127.0.0.1:8787
    description: 本地内容服务
  - url: https://hongguoduanju.com
    description: 官网
  - url: https://api5-normal-sinfonlinea.fqnovel.com
    description: App 主线路

tags:
  - name: 本地内容服务
    description: Node 服务与客户端共用的协议。默认监听 127.0.0.1:8787，BRIDGE_TOKEN 非空时要求 Bearer 口令。
  - name: 官网
    description: Next.js SSR 页面，数据在 HTML 的 _ROUTER_DATA 中，无需签名。
  - name: 搜索
    description: App 搜索，需设备参数与签名头。
  - name: 播放
    description: 播放地址解析、视频信息与 CDN 拉流。
  - name: 弹幕
    description: 按 30 秒窗口拉取一集弹幕。

security: []

paths:

  # ---------- 本地内容服务 ----------

  /health:
    servers: [{url: "http://127.0.0.1:8787"}]
    get:
      tags: [本地内容服务]
      operationId: localHealth
      summary: 健康检查
      description: 只检查服务进程本身，不校验上游内容源是否可用。
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 服务信息
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/home:
    servers: [{url: "http://127.0.0.1:8787"}]
    get:
      tags: [本地内容服务]
      operationId: localHome
      summary: 首页推荐列表
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: 推荐列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeriesList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {$ref: '#/components/responses/BadGateway'}

  /api/search:
    servers: [{url: "http://127.0.0.1:8787"}]
    get:
      tags: [本地内容服务]
      operationId: localSearch
      summary: 关键词搜索
      description: |
        优先走 App 搜索接口（/reading/bookapi/search/tab/v，短剧 tab_type=11、漫剧 19，第 2 页起带游标）；
        该接口对匿名设备返回 200 + 空响应体，此时退回官网搜索（第 1 页）+ 片库目录（第 2 页起）。
        配置 HONGGUO_SESSION_TOKEN（App 抓到的 x-tt-token）后 App 接口按登录态返回数据，第 1 页起就用它。
        两条路都失败时返回 502，不返回空列表。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeriesList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {$ref: '#/components/responses/BadGateway'}

  /api/series/{seriesId}:
    servers: [{url: "http://127.0.0.1:8787"}]
    get:
      tags: [本地内容服务]
      operationId: localSeries
      summary: 剧集详情与分集列表
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/SeriesIdPath'
      responses:
        '200':
          description: 剧集详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeriesDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {$ref: '#/components/responses/BadGateway'}

  /api/episodes/{episodeId}/play:
    servers: [{url: "http://127.0.0.1:8787"}]
    get:
      tags: [本地内容服务]
      operationId: localPlay
      summary: 解析播放地址
      description: 返回当前服务地址下的媒体路径，不返回上游直链。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/EpisodeIdPath'
        - $ref: '#/components/parameters/Fresh'
      responses:
        '200':
          description: 媒体路径
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Play'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {$ref: '#/components/responses/BadGateway'}

  /api/episodes/{episodeId}/stream:
    servers: [{url: "http://127.0.0.1:8787"}]
    get:
      tags: [本地内容服务]
      operationId: localStream
      summary: 拉取 MP4 媒体流
      description: 按 1 MiB 分块转发并遵守客户端背压；同时最多 4 路，超出返回 503。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/EpisodeIdPath'
        - $ref: '#/components/parameters/LocalRange'
      responses:
        '200':
          description: 完整媒体内容
          content:
            video/mp4:
              schema: {type: string, format: binary}
        '206':
          description: 分段媒体内容
          headers:
            Content-Range:
              description: 实际返回的区间
              schema: {type: string, example: "bytes 0-1048575/12345678"}
          content:
            video/mp4:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '416': {$ref: '#/components/responses/RangeNotSatisfiable'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    head:
      tags: [本地内容服务]
      operationId: localStreamHead
      summary: 读取媒体元信息
      description: 返回 Content-Length 与 Accept-Ranges，不返回内容。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/EpisodeIdPath'
        - $ref: '#/components/parameters/LocalRange'
      responses:
        '200': {description: 媒体长度}
        '206': {description: 分段媒体长度}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '416': {$ref: '#/components/responses/RangeNotSatisfiable'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ---------- 官网 ----------

  /category:
    servers: [{url: "https://hongguoduanju.com"}]
    get:
      tags: [官网]
      operationId: websiteCategory
      summary: 首页 / 分类列表
      description: 取 HTML 中 _ROUTER_DATA 的 loaderData.category_page（部分响应为 category_$）。
      parameters:
        - $ref: '#/components/parameters/Tab'
        - $ref: '#/components/parameters/SortType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/WebsiteUserAgent'
      responses:
        '200':
          description: 分类页数据
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoryRouterData'}
        '404': {$ref: '#/components/responses/UpstreamNotFound'}

  /category/{route}:
    servers: [{url: "https://hongguoduanju.com"}]
    get:
      tags: [官网]
      operationId: websiteCatalog
      summary: 片库目录
      description: 搜索第 2 页起的补页来源，route-key 固定为 category_$。
      parameters:
        - $ref: '#/components/parameters/CatalogRoute'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/WebsiteUserAgent'
      responses:
        '200':
          description: 目录页数据
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogRouterData'}
        '404': {$ref: '#/components/responses/UpstreamNotFound'}

  /detail:
    servers: [{url: "https://hongguoduanju.com"}]
    get:
      tags: [官网]
      operationId: websiteDetail
      summary: 剧集详情与分集列表
      description: 取 loaderData.detail_page；vid_list 顺序即集号。
      parameters:
        - $ref: '#/components/parameters/WebsiteSeriesId'
        - $ref: '#/components/parameters/WebsiteUserAgent'
      responses:
        '200':
          description: 详情页数据
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DetailRouterData'}
        '404': {$ref: '#/components/responses/UpstreamNotFound'}

  /search/{keyword}:
    servers: [{url: "https://hongguoduanju.com"}]
    get:
      tags: [官网]
      operationId: websiteSearch
      summary: 官网搜索（第 1 页兜底）
      description: page 参数被服务端忽略，一次只返回约 10 条。App 搜索接口不可用时，搜索第 1 页退回这里。
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/WebsiteUserAgent'
      responses:
        '200':
          description: 搜索结果（loaderData.search_(keyword)/page 或 search_page）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchRouterData'}
        '404': {$ref: '#/components/responses/UpstreamNotFound'}

  /rank/{route}:
    servers: [{url: "https://hongguoduanju.com"}]
    get:
      tags: [官网]
      operationId: websiteRank
      summary: 榜单
      description: 优先读 script data-fn-name 的序列化数据，缺失时退回已渲染的 DOM。
      parameters:
        - $ref: '#/components/parameters/RankRoute'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/WebsiteUserAgent'
      responses:
        '200':
          description: 榜单数据
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RankPayload'}
        '404': {$ref: '#/components/responses/UpstreamNotFound'}

  # ---------- App 搜索 ----------

  /reading/bookapi/search/tab/v:
    servers:
      - {url: "https://api5-normal-sinfonlinea.fqnovel.com"}
      - {url: "https://api5-normal-sinfonlinec.fqnovel.com"}
      - {url: "https://api5-normal-sinfonlineb.fqnovel.com"}
      - {url: "https://api5-normal-lf.fqnovel.com"}
      - {url: "https://api5-normal-lq.fqnovel.com"}
      - {url: "https://api5-normal-hl.fqnovel.com"}
    get:
      tags: [搜索]
      operationId: appSearch
      summary: App 搜索
      description: |
        搜索的首选入口：短剧 tab_type=11、漫剧 19，第 2 页起带上一页的 search_id / passback / next_offset。
        匿名设备返回 200 + 空响应体，需先判空再解析（此时客户端退回官网搜索 + 片库目录）；
        带上登录态（x-tt-token）后才有数据。
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchCount'
        - $ref: '#/components/parameters/SearchOffset'
        - $ref: '#/components/parameters/SearchTabType'
        - $ref: '#/components/parameters/BookshelfSearchPlan'
        - $ref: '#/components/parameters/UseCorrect'
        - $ref: '#/components/parameters/UserIsLogin'
        - $ref: '#/components/parameters/SearchId'
        - $ref: '#/components/parameters/Passback'
        - $ref: '#/components/parameters/Ts'
        - $ref: '#/components/parameters/Rticket'
        - $ref: '#/components/parameters/DeviceIid'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceAc'
        - $ref: '#/components/parameters/DeviceChannel'
        - $ref: '#/components/parameters/DeviceAid'
        - $ref: '#/components/parameters/DeviceAppName'
        - $ref: '#/components/parameters/DeviceVersionCode'
        - $ref: '#/components/parameters/DeviceVersionName'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/DeviceOs'
        - $ref: '#/components/parameters/DeviceSsmix'
        - $ref: '#/components/parameters/DeviceType'
        - $ref: '#/components/parameters/DeviceBrand'
        - $ref: '#/components/parameters/DeviceLanguage'
        - $ref: '#/components/parameters/DeviceOsApi'
        - $ref: '#/components/parameters/DeviceOsVersion'
        - $ref: '#/components/parameters/DeviceManifestVersionCode'
        - $ref: '#/components/parameters/DeviceResolution'
        - $ref: '#/components/parameters/DeviceDpi'
        - $ref: '#/components/parameters/DeviceUpdateVersionCode'
        - $ref: '#/components/parameters/DeviceHostAbi'
        - $ref: '#/components/parameters/DeviceDragonDeviceType'
        - $ref: '#/components/parameters/DevicePvPlayer'
        - $ref: '#/components/parameters/DeviceComplianceStatus'
        - $ref: '#/components/parameters/DeviceNeedPersonalRecommend'
        - $ref: '#/components/parameters/DevicePlayerSoLoad'
        - $ref: '#/components/parameters/DeviceIsAndroidPadScreen'
        - $ref: '#/components/parameters/HeaderSsReqTicket'
        - $ref: '#/components/parameters/HeaderKhronos'
        - $ref: '#/components/parameters/HeaderLadon'
        - $ref: '#/components/parameters/HeaderArgus'
        - $ref: '#/components/parameters/HeaderGorgon'
        - $ref: '#/components/parameters/HeaderHelios'
        - $ref: '#/components/parameters/HeaderMedusa'
        - $ref: '#/components/parameters/HeaderTtRequestTag'
        - $ref: '#/components/parameters/HeaderSdkVersion'
        - $ref: '#/components/parameters/HeaderPassportSdkVersion'
        - $ref: '#/components/parameters/HeaderXsFromWeb'
        - $ref: '#/components/parameters/HeaderTtDt'
        - $ref: '#/components/parameters/HeaderAccept'
        - $ref: '#/components/parameters/HeaderUserAgentApp'
      responses:
        '200':
          description: 搜索结果；匿名设备可能为空响应体
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppSearchResponse'}
            text/plain:
              schema: {type: string, enum: [""]}
        '403': {$ref: '#/components/responses/Forbidden'}

  # ---------- 播放 ----------

  /novel/player/multi_video_model/v1/:
    servers: [{url: "https://api5-normal-sinfonlineb.fqnovel.com"}]
    post:
      tags: [播放]
      operationId: videoModel
      summary: 播放地址解析
      description: 按分集 ID 解析 fallback_api；video_model 可能是对象或字符串化 JSON。
      parameters:
        - $ref: '#/components/parameters/Ts'
        - $ref: '#/components/parameters/Rticket'
        - $ref: '#/components/parameters/DeviceIid'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceAc'
        - $ref: '#/components/parameters/DeviceChannel'
        - $ref: '#/components/parameters/DeviceAid'
        - $ref: '#/components/parameters/DeviceAppName'
        - $ref: '#/components/parameters/DeviceVersionCode'
        - $ref: '#/components/parameters/DeviceVersionName'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/DeviceOs'
        - $ref: '#/components/parameters/DeviceSsmix'
        - $ref: '#/components/parameters/DeviceType'
        - $ref: '#/components/parameters/DeviceBrand'
        - $ref: '#/components/parameters/DeviceLanguage'
        - $ref: '#/components/parameters/DeviceOsApi'
        - $ref: '#/components/parameters/DeviceOsVersion'
        - $ref: '#/components/parameters/DeviceManifestVersionCode'
        - $ref: '#/components/parameters/DeviceResolution'
        - $ref: '#/components/parameters/DeviceDpi'
        - $ref: '#/components/parameters/DeviceUpdateVersionCode'
        - $ref: '#/components/parameters/DeviceHostAbi'
        - $ref: '#/components/parameters/DeviceDragonDeviceType'
        - $ref: '#/components/parameters/DevicePvPlayer'
        - $ref: '#/components/parameters/DeviceComplianceStatus'
        - $ref: '#/components/parameters/DeviceNeedPersonalRecommend'
        - $ref: '#/components/parameters/DevicePlayerSoLoad'
        - $ref: '#/components/parameters/DeviceIsAndroidPadScreen'
        - $ref: '#/components/parameters/HeaderSsReqTicket'
        - $ref: '#/components/parameters/HeaderKhronos'
        - $ref: '#/components/parameters/HeaderLadon'
        - $ref: '#/components/parameters/HeaderArgus'
        - $ref: '#/components/parameters/HeaderGorgon'
        - $ref: '#/components/parameters/HeaderHelios'
        - $ref: '#/components/parameters/HeaderMedusa'
        - $ref: '#/components/parameters/HeaderTtRequestTag'
        - $ref: '#/components/parameters/HeaderSdkVersion'
        - $ref: '#/components/parameters/HeaderPassportSdkVersion'
        - $ref: '#/components/parameters/HeaderXsFromWeb'
        - $ref: '#/components/parameters/HeaderTtDt'
        - $ref: '#/components/parameters/HeaderAccept'
        - $ref: '#/components/parameters/HeaderContentType'
        - $ref: '#/components/parameters/HeaderVcBdturingSdkVersion'
        - $ref: '#/components/parameters/HeaderSsStubBody'
        - $ref: '#/components/parameters/HeaderUserAgentPlayer'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VideoModelRequest'}
      responses:
        '200':
          description: 播放模型
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VideoModelResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}

  /fallback/{path}:
    servers:
      - url: "{origin}"
        variables:
          origin: {default: "https://v26-web.douyinvod.com"}
    get:
      tags: [播放]
      operationId: videoInfo
      summary: 视频信息
      description: 地址来自播放接口返回的 fallback_api，无需签名。
      parameters:
        - $ref: '#/components/parameters/AnyPath'
        - $ref: '#/components/parameters/HeaderUserAgentPlayer'
      responses:
        '200':
          description: 清晰度列表与密钥材料
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VideoInfoResponse'}
        '404': {$ref: '#/components/responses/UpstreamNotFound'}

  /media/{path}:
    servers:
      - url: "{origin}"
        variables:
          origin: {default: "https://v26-web.douyinvod.com"}
    get:
      tags: [播放]
      operationId: videoSegment
      summary: 视频分段
      description: 地址来自 video_list 的 main_url；必须返回 206 并给出 Content-Range。
      parameters:
        - $ref: '#/components/parameters/AnyPath'
        - $ref: '#/components/parameters/HeaderUserAgentPlayer'
        - $ref: '#/components/parameters/HeaderReferer'
        - $ref: '#/components/parameters/HeaderRange'
        - $ref: '#/components/parameters/HeaderAcceptEncoding'
      responses:
        '206':
          description: 分段内容
          headers:
            Content-Range:
              description: 必须与请求区间一致
              schema: {type: string, example: "bytes 0-262143/12345678"}
          content:
            video/mp4:
              schema: {type: string, format: binary}
        '200':
          description: 不支持分段，客户端判为失败
        '416': {$ref: '#/components/responses/RangeNotSatisfiable'}

  # ---------- 弹幕 ----------

  /novel/commentapi/comment/list/{vid}/v1/:
    servers:
      - {url: "https://api5-normal-sinfonlinea.fqnovel.com"}
      - {url: "https://api5-normal-sinfonlinec.fqnovel.com"}
      - {url: "https://api5-normal-sinfonlineb.fqnovel.com"}
      - {url: "https://api5-normal-lf.fqnovel.com"}
      - {url: "https://api5-normal-lq.fqnovel.com"}
      - {url: "https://api5-normal-hl.fqnovel.com"}
    post:
      tags: [弹幕]
      operationId: danmakuWindow
      summary: 一集弹幕（30 秒窗口）
      description: 一次只返回一个 30 秒窗口；匿名设备有频控，窗口之间至少间隔 180ms。
      parameters:
        - $ref: '#/components/parameters/Vid'
        - $ref: '#/components/parameters/Ts'
        - $ref: '#/components/parameters/Rticket'
        - $ref: '#/components/parameters/DeviceIid'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceAc'
        - $ref: '#/components/parameters/DeviceChannel'
        - $ref: '#/components/parameters/DeviceAid'
        - $ref: '#/components/parameters/DeviceAppName'
        - $ref: '#/components/parameters/DeviceVersionCode'
        - $ref: '#/components/parameters/DeviceVersionName'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/DeviceOs'
        - $ref: '#/components/parameters/DeviceSsmix'
        - $ref: '#/components/parameters/DeviceType'
        - $ref: '#/components/parameters/DeviceBrand'
        - $ref: '#/components/parameters/DeviceLanguage'
        - $ref: '#/components/parameters/DeviceOsApi'
        - $ref: '#/components/parameters/DeviceOsVersion'
        - $ref: '#/components/parameters/DeviceManifestVersionCode'
        - $ref: '#/components/parameters/DeviceResolution'
        - $ref: '#/components/parameters/DeviceDpi'
        - $ref: '#/components/parameters/DeviceUpdateVersionCode'
        - $ref: '#/components/parameters/DeviceHostAbi'
        - $ref: '#/components/parameters/DeviceDragonDeviceType'
        - $ref: '#/components/parameters/DevicePvPlayer'
        - $ref: '#/components/parameters/DeviceComplianceStatus'
        - $ref: '#/components/parameters/DeviceNeedPersonalRecommend'
        - $ref: '#/components/parameters/DevicePlayerSoLoad'
        - $ref: '#/components/parameters/DeviceIsAndroidPadScreen'
        - $ref: '#/components/parameters/HeaderSsReqTicket'
        - $ref: '#/components/parameters/HeaderKhronos'
        - $ref: '#/components/parameters/HeaderLadon'
        - $ref: '#/components/parameters/HeaderArgus'
        - $ref: '#/components/parameters/HeaderGorgon'
        - $ref: '#/components/parameters/HeaderHelios'
        - $ref: '#/components/parameters/HeaderMedusa'
        - $ref: '#/components/parameters/HeaderTtRequestTag'
        - $ref: '#/components/parameters/HeaderSdkVersion'
        - $ref: '#/components/parameters/HeaderPassportSdkVersion'
        - $ref: '#/components/parameters/HeaderXsFromWeb'
        - $ref: '#/components/parameters/HeaderTtDt'
        - $ref: '#/components/parameters/HeaderAccept'
        - $ref: '#/components/parameters/HeaderContentType'
        - $ref: '#/components/parameters/HeaderVcBdturingSdkVersion'
        - $ref: '#/components/parameters/HeaderSsStubEmpty'
        - $ref: '#/components/parameters/HeaderCommentSource'
        - $ref: '#/components/parameters/HeaderServerChannel'
        - $ref: '#/components/parameters/HeaderUserAgentPlayer'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DanmakuRequest'}
      responses:
        '200':
          description: 一个 30 秒窗口
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DanmakuResponse'}
        '429': {$ref: '#/components/responses/RateLimited'}

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "BRIDGE_TOKEN 的值，形如 Authorization: Bearer <口令>。"

  responses:
    BadRequest:
      description: 参数无效
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: 访问口令缺失或不正确
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: 路径或剧集不存在
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BadGateway:
      description: 上游内容源不可用
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RangeNotSatisfiable:
      description: 无效的媒体区间
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServiceUnavailable:
      description: 并发播放数已达上限
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: 签名校验或风控拦截
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: 请求过于频繁，被频控
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UpstreamNotFound:
      description: 页面、剧集或地址不存在（可能已过期）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  parameters:

    # --- 本地内容服务 ---
    Page:
      name: page
      in: query
      description: 页码，从 1 开始，上限 100。
      schema: {type: integer, minimum: 1, maximum: 100, default: 1}
    Query:
      name: q
      in: query
      required: true
      description: 搜索关键词，1–80 字。
      schema: {type: string, minLength: 1, maxLength: 80}
    SeriesIdPath:
      name: seriesId
      in: path
      required: true
      description: 剧集 ID，纯数字字符串。
      schema: {type: string, pattern: "^[0-9]{1,30}$"}
    EpisodeIdPath:
      name: episodeId
      in: path
      required: true
      description: 分集 ID（vid），来自详情接口的 episodes。
      schema: {type: string, pattern: "^[0-9]{1,30}$"}
    Fresh:
      name: fresh
      in: query
      description: 传 1 时清空该分集的地址缓存并重新解析。
      schema: {type: string, enum: ["1"]}
    LocalRange:
      name: Range
      in: header
      description: 单区间 bytes=a-b 或后缀区间 bytes=-n；不传返回整段。
      schema: {type: string, example: "bytes=0-1048575"}

    # --- 官网 ---
    Tab:
      name: tab
      in: query
      description: 分类，1 为短剧（真人剧）。
      schema: {type: integer, enum: [1], default: 1}
    SortType:
      name: sort_type
      in: query
      description: 排序，1 最热，2 最新。
      schema: {type: integer, enum: [1, 2], default: 1}
    CatalogRoute:
      name: route
      in: path
      required: true
      description: 目录线路。
      schema: {type: string, enum: [comic-drama, real-drama]}
    RankRoute:
      name: route
      in: path
      required: true
      description: 榜单线路。
      schema: {type: string, enum: [hot-drama, hot-real-drama, hot-comic-drama, hot-ai-drama]}
    Keyword:
      name: keyword
      in: path
      required: true
      description: 关键词，需 URL 编码。
      schema: {type: string}
    WebsiteSeriesId:
      name: series_id
      in: query
      required: true
      description: 剧集 ID，纯数字字符串。
      schema: {type: string, pattern: "^[0-9]{1,30}$"}
    Vid:
      name: vid
      in: path
      required: true
      description: 分集 ID（vid）。
      schema: {type: string, pattern: "^[0-9]{1,30}$"}
    AnyPath:
      name: path
      in: path
      required: true
      description: 播放接口返回的地址路径部分。
      schema: {type: string}

    # --- App 搜索业务参数 ---
    SearchQuery:
      name: query
      in: query
      required: true
      description: 搜索关键词。
      schema: {type: string, maxLength: 80}
    SearchCount:
      name: count
      in: query
      description: 每页条数。
      schema: {type: integer, default: 20}
    SearchOffset:
      name: offset
      in: query
      description: 偏移量 (page-1)*count；翻页时以游标 next_offset 为准。
      schema: {type: integer, default: 0}
    SearchTabType:
      name: tab_type
      in: query
      description: 结果类型，11 短剧，19 漫剧。
      schema: {type: integer, enum: [11, 19]}
    BookshelfSearchPlan:
      name: bookshelf_search_plan
      in: query
      description: 固定值。
      schema: {type: string, default: "4"}
    UseCorrect:
      name: use_correct
      in: query
      description: 是否启用纠错。
      schema: {type: string, default: "true"}
    UserIsLogin:
      name: user_is_login
      in: query
      description: 登录态，匿名设备为 0。
      schema: {type: string, default: "0"}
    SearchId:
      name: search_id
      in: query
      description: 上一页返回的 search_tabs[].search_id，第 2 页起必带。
      schema: {type: string}
    Passback:
      name: passback
      in: query
      description: 上一页返回的 search_tabs[].passback，第 2 页起必带。
      schema: {type: string}

    # --- 设备参数 ---
    DeviceIid:
      name: iid
      in: query
      required: true
      description: 安装 ID。
      schema: {type: string, default: "1905892595382586"}
    DeviceId:
      name: device_id
      in: query
      required: true
      description: 设备 ID。
      schema: {type: string, default: "1905892595378490"}
    DeviceAc:
      name: ac
      in: query
      required: true
      description: 网络类型。
      schema: {type: string, default: wifi}
    DeviceChannel:
      name: channel
      in: query
      required: true
      description: 分发渠道。
      schema: {type: string, default: update_64}
    DeviceAid:
      name: aid
      in: query
      required: true
      description: 应用 ID，红果短剧为 8662。
      schema: {type: string, default: "8662"}
    DeviceAppName:
      name: app_name
      in: query
      required: true
      description: 应用名。
      schema: {type: string, default: novelread}
    DeviceVersionCode:
      name: version_code
      in: query
      required: true
      description: 客户端版本号；搜索与弹幕用 72232，播放接口用 71332。
      schema: {type: string, enum: ["71332", "72232"], default: "71332"}
    DeviceVersionName:
      name: version_name
      in: query
      required: true
      description: 版本名，与 version_code 成对。
      schema: {type: string, enum: [7.1.3.32, 7.2.2.32], default: 7.1.3.32}
    DevicePlatform:
      name: device_platform
      in: query
      required: true
      description: 平台。
      schema: {type: string, default: android}
    DeviceOs:
      name: os
      in: query
      required: true
      description: 操作系统。
      schema: {type: string, default: android}
    DeviceSsmix:
      name: ssmix
      in: query
      required: true
      description: 固定值。
      schema: {type: string, default: a}
    DeviceType:
      name: device_type
      in: query
      required: true
      description: 机型。
      schema: {type: string, default: 25053RT47C}
    DeviceBrand:
      name: device_brand
      in: query
      required: true
      description: 品牌。
      schema: {type: string, default: Redmi}
    DeviceLanguage:
      name: language
      in: query
      required: true
      description: 语言。
      schema: {type: string, default: zh}
    DeviceOsApi:
      name: os_api
      in: query
      required: true
      description: Android API 等级。
      schema: {type: string, default: "36"}
    DeviceOsVersion:
      name: os_version
      in: query
      required: true
      description: Android 版本。
      schema: {type: string, default: "16"}
    DeviceManifestVersionCode:
      name: manifest_version_code
      in: query
      required: true
      description: 与 version_code 同步。
      schema: {type: string, enum: ["71332", "72232"], default: "71332"}
    DeviceResolution:
      name: resolution
      in: query
      required: true
      description: 屏幕分辨率。
      schema: {type: string, default: "1280*2772"}
    DeviceDpi:
      name: dpi
      in: query
      required: true
      description: 屏幕密度。
      schema: {type: string, default: "520"}
    DeviceUpdateVersionCode:
      name: update_version_code
      in: query
      required: true
      description: 与 version_code 同步。
      schema: {type: string, enum: ["71332", "72232"], default: "71332"}
    DeviceHostAbi:
      name: host_abi
      in: query
      required: true
      description: CPU 架构。
      schema: {type: string, default: arm64-v8a}
    DeviceDragonDeviceType:
      name: dragon_device_type
      in: query
      required: true
      description: 设备形态。
      schema: {type: string, default: phone}
    DevicePvPlayer:
      name: pv_player
      in: query
      required: true
      description: 播放器版本，与 version_code 同步。
      schema: {type: string, enum: ["71332", "72232"], default: "71332"}
    DeviceComplianceStatus:
      name: compliance_status
      in: query
      required: true
      description: 合规状态。
      schema: {type: string, default: "0"}
    DeviceNeedPersonalRecommend:
      name: need_personal_recommend
      in: query
      required: true
      description: 是否需要个性化推荐。
      schema: {type: string, default: "1"}
    DevicePlayerSoLoad:
      name: player_so_load
      in: query
      required: true
      description: 播放器 so 加载标记。
      schema: {type: string, default: "1"}
    DeviceIsAndroidPadScreen:
      name: is_android_pad_screen
      in: query
      required: true
      description: 是否平板屏幕。
      schema: {type: string, default: "0"}

    # --- 签名参数 ---
    Ts:
      name: ts
      in: query
      required: true
      description: 秒级时间戳。
      schema: {type: integer}
    Rticket:
      name: _rticket
      in: query
      required: true
      description: 毫秒级时间戳；从当前时间逐个 +1 试到分支号 branch == 0，最多 128 次。
      schema: {type: integer}

    # --- 请求头 ---
    HeaderSsReqTicket:
      name: x-ss-req-ticket
      in: header
      required: true
      description: 命中 branch == 0 的 _rticket。
      schema: {type: string}
    HeaderKhronos:
      name: x-khronos
      in: header
      required: true
      description: 与 ts 相同。
      schema: {type: string}
    HeaderLadon:
      name: x-ladon
      in: header
      required: true
      description: ts 大端字节 base64。
      schema: {type: string, format: byte}
    HeaderArgus:
      name: x-argus
      in: header
      required: true
      description: ts 小端字节 base64。
      schema: {type: string, format: byte}
    HeaderGorgon:
      name: x-gorgon
      in: header
      required: true
      description: 由 MD5(query)、MD5(body) 与 ts 经 RC4 变体加密并做位变换生成。
      schema: {type: string}
    HeaderHelios:
      name: x-helios
      in: header
      required: true
      description: 表驱动伪随机流，输入为 ts-1588093228-8662。
      schema: {type: string, format: byte}
    HeaderMedusa:
      name: x-medusa
      in: header
      required: true
      description: 设备环境 protobuf 经 AesV3 加密后 base64。
      schema: {type: string, format: byte}
    HeaderTtRequestTag:
      name: x-tt-request-tag
      in: header
      required: true
      description: 固定值。
      schema: {type: string, default: "t=0;n=0"}
    HeaderSdkVersion:
      name: sdk-version
      in: header
      required: true
      description: 固定值。
      schema: {type: string, default: "2"}
    HeaderPassportSdkVersion:
      name: passport-sdk-version
      in: header
      required: true
      description: 固定值。
      schema: {type: string, default: "50561"}
    HeaderXsFromWeb:
      name: x-xs-from-web
      in: header
      required: true
      description: 固定值。
      schema: {type: string, default: "0"}
    HeaderTtDt:
      name: x-tt-dt
      in: header
      required: true
      description: 空值。
      schema: {type: string, default: ""}
    HeaderAccept:
      name: Accept
      in: header
      required: true
      description: 期望的响应类型。
      schema: {type: string, default: "application/json; charset=utf-8,application/x-protobuf"}
    HeaderContentType:
      name: Content-Type
      in: header
      required: true
      description: 有 body 时必带。
      schema: {type: string, default: "application/json; charset=UTF-8"}
    HeaderVcBdturingSdkVersion:
      name: x-vc-bdturing-sdk-version
      in: header
      required: true
      description: 有 body 时必带。
      schema: {type: string, default: 3.7.2.cn}
    HeaderSsStubBody:
      name: x-ss-stub
      in: header
      required: true
      description: body 的 MD5，大写十六进制。
      schema: {type: string, pattern: "^[0-9A-F]{32}$"}
    HeaderSsStubEmpty:
      name: x-ss-stub
      in: header
      required: true
      description: 弹幕接口显式置空。
      schema: {type: string, enum: [""]}
    HeaderCommentSource:
      name: comment-source
      in: header
      required: true
      description: 弹幕接口固定值。
      schema: {type: string, default: "601"}
    HeaderServerChannel:
      name: server-channel
      in: header
      required: true
      description: 弹幕接口固定值。
      schema: {type: string, default: "1000"}
    HeaderUserAgentApp:
      name: User-Agent
      in: header
      required: true
      description: 无 body 的 App 请求使用；版本号与 version_code 72232 对应。
      schema:
        type: string
        enum:
          - "com.phoenix.read/72232 (Linux; U; Android 16; zh_CN; 25053RT47C; Build/BP2A.250605.031.A3)"
    HeaderUserAgentPlayer:
      name: User-Agent
      in: header
      required: true
      description: 有 body 的请求与 CDN 拉流使用；版本号与 version_code 71332 对应。
      schema:
        type: string
        enum:
          - "com.phoenix.read/71332 (Linux; U; Android 16; zh_CN; 25053RT47C; Build/BP2A.250605.031.A3; Cronet/TTNetVersion:04657795 2026-01-23 QuicVersion:c67e9834 2025-09-08)"
    HeaderReferer:
      name: Referer
      in: header
      required: true
      description: CDN 拉流固定值。
      schema: {type: string, default: "https://novel.snssdk.com/"}
    HeaderRange:
      name: Range
      in: header
      required: true
      description: 单段区间，单段最大 8 MiB。
      schema: {type: string, pattern: "^bytes=[0-9]+-[0-9]+$", example: "bytes=0-262143"}
    HeaderAcceptEncoding:
      name: Accept-Encoding
      in: header
      required: true
      description: CDN 拉流固定值。
      schema: {type: string, default: identity}
    WebsiteUserAgent:
      name: User-Agent
      in: header
      required: false
      description: 官网请求统一使用播放器 UA，并带 Accept-Language zh-CN。
      schema: {type: string}

  schemas:

    # --- 本地内容服务 ---
    Error:
      type: object
      description: 失败响应
      properties:
        error: {type: string, description: 可显示的错误信息}
    Health:
      type: object
      description: 进程信息，不代表上游可用
      properties:
        service: {type: string, description: 服务标识}
        version: {type: string, description: 服务版本}
        apiVersion: {type: integer, description: 协议版本}
        upstream: {type: string, description: 上游校验状态}
    Series:
      type: object
      properties:
        id: {type: string, description: 剧集 ID，始终为字符串}
        title: {type: string, description: 剧名}
        cover: {type: string, description: 封面地址}
        description: {type: string, description: 简介}
        badge: {type: string, description: 角标文案}
        tags: {type: string, description: 标签文案}
    Episode:
      type: object
      properties:
        id: {type: string, description: 分集 ID（vid）}
        number: {type: integer, description: 集号，从 1 开始}
        title: {type: string, description: 分集标题}
    SeriesList:
      type: object
      properties:
        items:
          type: array
          description: 当前页剧集
          items: {$ref: '#/components/schemas/Series'}
        page: {type: integer, description: 当前页码}
    SeriesDetail:
      allOf:
        - $ref: '#/components/schemas/Series'
        - type: object
          properties:
            episodes:
              type: array
              description: 分集列表，顺序即集号
              items: {$ref: '#/components/schemas/Episode'}
    Play:
      type: object
      properties:
        path: {type: string, description: 相对当前服务地址的媒体路径}
        contentType: {type: string, description: 媒体类型}

    # --- 官网 ---
    Card:
      type: object
      description: 官网与 App 搜索共用的卡片
      properties:
        video_data: {$ref: '#/components/schemas/VideoData'}
    VideoData:
      type: object
      properties:
        series_id: {type: string, description: 剧集 ID}
        series_name: {type: string, description: 剧名}
        series_title: {type: string, description: 剧名（部分响应）}
        series_cover: {type: string, description: 封面地址}
        series_intro: {type: string, description: 简介}
        episode_cnt: {type: integer, description: 总集数}
        episode_right_text: {type: string, description: 集数角标文案}
        series_episode_info:
          type: object
          properties:
            episode_cnt: {type: integer, description: 总集数}
        tags:
          type: array
          items:
            type: object
            properties:
              name: {type: string, description: 标签名}
        category_list:
          type: array
          description: 分类信息
          items: {type: object}
    Pagination:
      type: object
      properties:
        pageNum: {type: integer, description: 当前页}
        totalPages: {type: integer, description: 总页数}
    CategoryPage:
      type: object
      properties:
        recommendList:
          type: array
          description: 列表，优先取此字段
          items: {$ref: '#/components/schemas/Card'}
        categoryData:
          type: object
          properties:
            recommendList:
              type: array
              description: recommendList 缺失时的兜底
              items: {$ref: '#/components/schemas/Card'}
        pagination: {$ref: '#/components/schemas/Pagination'}
    CategoryRouterData:
      type: object
      properties:
        loaderData:
          type: object
          properties:
            category_page: {$ref: '#/components/schemas/CategoryPage'}
            category_$: {$ref: '#/components/schemas/CategoryPage'}
    CatalogRouterData:
      type: object
      properties:
        loaderData:
          type: object
          properties:
            category_$: {$ref: '#/components/schemas/CategoryPage'}
    DetailSeries:
      allOf:
        - $ref: '#/components/schemas/VideoData'
        - type: object
          properties:
            vid_list:
              type: array
              description: 分集 ID 列表，顺序即集号
              items: {type: string, pattern: "^[0-9]{1,30}$"}
    DetailRouterData:
      type: object
      properties:
        loaderData:
          type: object
          properties:
            detail_page:
              type: object
              properties:
                seriesDetail: {$ref: '#/components/schemas/DetailSeries'}
    SearchRouterData:
      type: object
      properties:
        loaderData:
          type: object
          properties:
            "search_(keyword)/page":
              type: object
              properties:
                searchList:
                  type: array
                  items: {$ref: '#/components/schemas/Card'}
            search_page:
              type: object
              properties:
                searchList:
                  type: array
                  items: {$ref: '#/components/schemas/Card'}
    RankItem:
      type: object
      properties:
        seriesId: {type: string, description: 剧集 ID}
        id: {type: string, description: 剧集 ID 兜底字段}
        title: {type: string, description: 剧名}
        cover: {type: string, description: 封面地址}
        description: {type: string, description: 简介}
        episodeCount: {type: integer, description: 总集数}
        episodeVids:
          type: array
          description: 分集 ID 列表
          items: {type: string}
        heatText: {type: string, description: 热度文案}
        rank: {type: integer, description: 名次}
        tags:
          type: array
          items: {type: string}
    RankPayload:
      type: object
      properties:
        isSuccess: {type: boolean, description: 数据是否有效}
        updatedText: {type: string, description: 更新文案}
        rankList:
          type: array
          items: {$ref: '#/components/schemas/RankItem'}
        pagination: {$ref: '#/components/schemas/Pagination'}

    # --- App 搜索 ---
    AppSearchResponse:
      type: object
      properties:
        code: {type: integer, description: 0 表示成功}
        search_tabs:
          type: array
          items: {$ref: '#/components/schemas/SearchTab'}
    SearchTab:
      type: object
      properties:
        tab_type: {type: integer, description: 结果类型，11 短剧，19 漫剧}
        search_id: {type: string, description: 下一页游标}
        passback: {type: string, description: 下一页游标}
        next_offset: {type: string, description: 下一页偏移量}
        has_more: {type: boolean, description: 是否还有下一页}
        data:
          type: array
          items: {$ref: '#/components/schemas/SearchCell'}
    SearchCell:
      type: object
      properties:
        book_id: {type: string, description: 剧集 ID 兜底字段}
        cell_name: {type: string, description: 标题兜底字段}
        search_result_id: {type: string, description: 剧集 ID 兜底字段}
        lynx_data: {type: string, description: 字符串化 JSON，可展开 cell_data}
        search_high_light:
          type: object
          properties:
            title:
              type: object
              properties:
                text: {type: string, description: 带高亮标签的标题}
        video_data:
          type: array
          description: 取第 0 项
          items: {$ref: '#/components/schemas/SearchVideo'}
    SearchVideo:
      type: object
      properties:
        series_id: {type: string, description: 剧集 ID}
        title: {type: string, description: 剧名}
        cover: {type: string, description: 封面地址}
        cover_url: {type: string, description: 封面地址}
        video_desc: {type: string, description: 简介}
        rec_text: {type: string, description: 推荐文案}
        sub_title: {type: string, description: 副标题}
        episode_cnt: {type: integer, description: 总集数}

    # --- 播放 ---
    VideoModelRequest:
      type: object
      required: [biz_param, mixed_video_id_map]
      properties:
        biz_param:
          type: object
          properties:
            detail_page_version: {type: integer, default: 0}
            device_level: {type: integer, default: 3}
            disable_digg_stat: {type: boolean, default: false}
            need_all_video_definition: {type: boolean, default: true}
            need_mp4_align: {type: boolean, default: false}
            use_os_player: {type: boolean, default: false}
            use_server_dns: {type: boolean, default: false}
            video_platform: {type: integer, default: 1024}
        mixed_video_id_map:
          type: object
          description: 固定键 1004，值为分集 ID 数组
          properties:
            "1004":
              type: array
              items: {type: string, pattern: "^[0-9]{1,30}$"}
    VideoModelResponse:
      type: object
      properties:
        Code: {type: integer, description: 0 表示成功，优先取此字段}
        code: {type: integer, description: Code 缺失时的兜底}
        data:
          type: object
          description: 以分集 ID 为键
          additionalProperties: {$ref: '#/components/schemas/VideoModelEntry'}
    VideoModelEntry:
      type: object
      properties:
        video_model:
          description: 可能是对象或字符串化 JSON
          oneOf:
            - $ref: '#/components/schemas/VideoModel'
            - {type: string}
            - {type: object}
    VideoModel:
      type: object
      properties:
        fallback_api:
          description: 可能是字符串、数组或对象，取出后再发一次 GET
          oneOf:
            - {type: string}
            - {type: array, items: {type: string}}
            - type: object
              properties:
                fallback_api: {type: string}
    VideoInfoResponse:
      type: object
      properties:
        video_info:
          type: object
          properties:
            data: {$ref: '#/components/schemas/VideoInfoData'}
    VideoInfoData:
      type: object
      properties:
        key_seed:
          type: string
          format: byte
          description: 非空时用 main_url 走地址解密
        video_list:
          type: object
          description: 以清晰度为键
          additionalProperties: {$ref: '#/components/schemas/VideoListItem'}
    VideoListItem:
      type: object
      properties:
        main_url: {type: string, description: 媒体地址，可能是加密串}
        codec_type: {type: string, description: bytevc2 / bvc2 的资源需跳过}
        spade_a: {type: string, format: byte, description: 非空时用于派生 16 字节内容密钥}
        quality_desc: {type: string, description: 清晰度文案}
        quality: {type: string, description: 清晰度兜底字段}
        height: {type: integer, description: 高度}
        vheight: {type: integer, description: 高度兜底字段}

    # --- 弹幕 ---
    DanmakuRequest:
      type: object
      required: [comment_source, server_channel, group_id, group_type, comment_type, business_param]
      properties:
        comment_source: {type: integer, default: 601}
        server_channel: {type: integer, default: 1000}
        group_id: {type: string, description: 分集 ID（vid）, pattern: "^[0-9]{1,30}$"}
        group_type: {type: integer, default: 30}
        comment_type: {type: integer, default: 20}
        sort: {type: integer, default: 1}
        count: {type: integer, default: 90}
        cursor: {type: string, description: 上一窗口的 common_list_info.cursor，原样回传}
        aid: {type: integer, default: 8662}
        compliance_status: {type: integer, default: 0}
        business_param:
          type: object
          properties:
            book_id: {type: string, description: 剧集 ID（series_id）, pattern: "^[0-9]{1,30}$"}
            start_offset_time: {type: integer, description: 本窗口起点，毫秒}
            playlet_item_duration: {type: integer, description: 本集总时长，毫秒}
            need_danmaku_guide_type:
              type: array
              items: {type: integer}
              default: [1, 3, 4, 2]
    DanmakuResponse:
      type: object
      properties:
        code: {type: integer, description: 0 表示成功}
        data:
          type: object
          properties:
            data_list:
              type: array
              items: {$ref: '#/components/schemas/DanmakuItem'}
            extra:
              type: object
              properties:
                next_query_danmaku_list_time: {type: integer, description: 下一个窗口起点，毫秒}
            common_list_info:
              type: object
              properties:
                cursor: {type: string, description: 下一个窗口的游标}
                has_more: {type: boolean, description: 是否还没到片尾}
    DanmakuItem:
      type: object
      properties:
        comment:
          type: object
          properties:
            common:
              type: object
              properties:
                content:
                  type: object
                  properties:
                    text: {type: string, description: 弹幕文本}
            expand:
              type: object
              properties:
                offset_time: {type: integer, description: 时间点，毫秒}
            stat:
              type: object
              properties:
                digg_count: {type: integer, description: 点赞数}
