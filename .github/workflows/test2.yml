name: test2 Release Android TV APK
# 每次推送到 main：把本次的 versionName / versionCode 与**上一次发布的 tag**比较
# （不是「上一个提交」——中间夹了多少次不升版本的普通推送都不影响基线）。
#   两个都**严格大于**基准 → 打包debug测试包（仅上传artifact，不发布Release）
#   两个都与基准相同      → 跳过，不打包（只改代码没升版本的普通推送）
#   其余（只升一个 / 降了）→ 失败，提示版本必须同时增大
# 基准取自 HEAD 上最近的 `v*` tag；一个都没有时回落到上一个提交。
# 比对规则在 tools/compare-version.sh，本地可单独跑（用法见该脚本头部）。
# 手动触发时可选 force=true，跳过比对直接打包当前版本（测试用，无需升级版本号）。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 跳过版本比对，直接打包debug测试包，无需升级版本号
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  version:
    name: 检查版本号
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.current.outputs.version }}
      code: ${{ steps.current.outputs.code }}
      apk: ${{ steps.current.outputs.apk }}
      tag: ${{ steps.current.outputs.tag }}
      min_sdk: ${{ steps.current.outputs.min_sdk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0            # 需要完整历史来定位上一次发布的 tag
          fetch-tags: true          # 基准取自发布 tag，必须把 tag 拉下来
      - name: 手动强制打包
        id: forced
        if: github.event_name == 'workflow_dispatch' && inputs.force
        run: echo "force=true，跳过版本比对，直接打包debug测试包。"
      - name: 读取当前版本
        id: current
        run: |
          set -euo pipefail
          version="$(tools/version.sh version)"
          code="$(tools/version.sh code)"
          apk="$(tools/version.sh apk)"
          min_sdk="$(tools/version.sh min-sdk)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code"       >> "$GITHUB_OUTPUT"
          echo "apk=$apk"         >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          echo "min_sdk=$min_sdk" >> "$GITHUB_OUTPUT"
          echo "本次提交：versionName=$version versionCode=$code minSdk=$min_sdk 产物=$apk"
      - name: 与上一个提交对比
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GRADLE_FILE: android/app/build.gradle.kts
        run: |
          set -euo pipefail
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force=true，视为版本已变动。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 基准 = **上一次发布的 tag**（HEAD 上最近的 `v*`），不是「上一个提交」：
          # 版本是相对「上一个正式版」升的，跟中间夹了多少次不升版本的普通推送无关。
          # 删除历史 tag 后基线会自然重算（例如只留 v1.0.0 时，下一次就是相对 v1.0.0 比）。
          # 用 --tags 才认轻量 tag（本仓库的发布 tag 都是轻量的）。
          # 不做「本次 tag 已存在就退到它父提交」的特殊处理：那种情况（补发同一版本）
          # 走 workflow_dispatch 的 force=true；这里若退到父提交，反而会把基准挪到
          # 更早的版本上，导致「已经发过的版本」被判成需要再发一次。
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            # 一个发布 tag 都没有：回落到「上一次推送前的提交」，再退到 HEAD~1。
            if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              previous="$BEFORE_SHA"
              echo "没有发布 tag，回落到上一个提交作为基准。"
            elif git rev-parse --verify -q HEAD~1 >/dev/null; then
              previous="$(git rev-parse HEAD~1)"
              echo "没有发布 tag，回落到 HEAD~1 作为基准。"
            fi
          fi
          if [ -z "$previous" ]; then
            echo "没有可比对的历史（首次推送），视为版本已变动。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "比对基准：$previous（$(git describe --tags --always "$previous" 2>/dev/null || echo "$previous")）"
          # 这个文件在历史里换过位置（早期在 kotlin-tv/ 下），逐个候选路径找出来
          old_file=""
          for candidate in "$GRADLE_FILE" "kotlin-tv/app/build.gradle.kts"; do
            if git cat-file -e "${previous}:${candidate}" 2>/dev/null; then old_file="$candidate"; break; fi
          done
          if [ -z "$old_file" ]; then
            echo "基准提交里没有找到 build.gradle.kts，视为版本已变动。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "基准文件：$old_file"
          git show "${previous}:${old_file}" > /tmp/previous-build.gradle.kts
          export HGTV_GRADLE_FILE=/tmp/previous-build.gradle.kts
          old_version="$(tools/version.sh version)"
          old_code="$(tools/version.sh code)"
          new_version="${{ steps.current.outputs.version }}"
          new_code="${{ steps.current.outputs.code }}"
          echo "基准版本：versionName=${old_version} versionCode=${old_code}"
          echo "本次：versionName=${new_version} versionCode=${new_code}"
          # 只有两个都**严格大于**基准才打包；判定逻辑收在 tools/compare-version.sh，
          # 本地可单独跑同一份规则（避免 CI 与本地各写一套比较）。
          # 工具在参数异常时以非零退出（set -e 会直接中断且看不出原因），这里显式接住。
          decision="$(tools/compare-version.sh "$old_version" "$old_code" "$new_version" "$new_code" | tail -1)" || decision=""
          [ -n "$decision" ] || { echo "::error::版本比对失败，请检查 tools/compare-version.sh 的输出"; exit 1; }
          case "$decision" in
            release)
              echo "changed=true" >> "$GITHUB_OUTPUT"
              ;;
            skip)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "版本未变动，跳过打包。"
              ;;
            *)
              echo "::error::版本必须同时大于基准才打包（versionName ${old_version} → ${new_version}、versionCode ${old_code} → ${new_code}）"
              exit 1
              ;;
          esac
  release:
    name: 打包Debug测试包（仅Artifact，不创建Release，无需签名密钥）
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: 安装 Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: 单元测试、lint、构建Debug测试包
        run: ./android/gradlew -p android :core:test :app:lintDebug :app:assembleDebug --console=plain
      - name: 命名产物并计算校验和
        id: apk
        run: |
          set -euo pipefail
          apk="${{ needs.version.outputs.apk }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" | tee SHA256SUMS
          echo "name=$apk" >> "$GITHUB_OUTPUT"
      - name: 生成应用内更新的元数据
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CODE: ${{ needs.version.outputs.code }}
          MIN_SDK: ${{ needs.version.outputs.min_sdk }}
          TAG: ${{ needs.version.outputs.tag }}
          APK: ${{ needs.version.outputs.apk }}
        run: |
          set -euo pipefail
          # 客户端弹窗显示的文案与 Release 正文同源：都取自 docs/CHANGELOG.md 当前版本那一节，
          # 只是 notes 用纯文字短版（剥掉 Markdown、长度封顶）。
          NOTES="$(HGTV_VERSION="$VERSION" tools/release-notes.sh notes)"
          export NOTES
          size="$(wc -c < "$APK" | tr -d ' ')"
          sha="$(sha256sum "$APK" | cut -d' ' -f1)"
          # update.json 是客户端「检查更新」读的唯一文件，字段与 AppUpdate.parse 一一对应。
          python3 - "$VERSION" "$CODE" "$MIN_SDK" "$TAG" "$APK" "$size" "$sha" "$NOTES" > update.json <<'PY'
          import json, sys
          version, code, min_sdk, tag, apk, size, sha, notes = sys.argv[1:9]
          print(json.dumps({
              "schema": 1,
              "packageName": "com.hgtv.star",
              "versionName": version,
              "versionCode": int(code),
              "minSdk": int(min_sdk),
              "tag": tag,
              "notes": notes.strip(),
              "apk": {"name": apk, "size": int(size), "sha256": sha},
          }, ensure_ascii=False, indent=2))
          PY
          cat update.json
      - name: 校验元数据能被客户端解析
        run: |
          set -euo pipefail
          ./android/gradlew -p android :core:test --tests 'com.hgtv.star.core.AppUpdatesTest' --console=plain
          python3 - <<'PY'
          import json, re
          meta = json.load(open("update.json", encoding="utf-8"))
          assert meta["schema"] == 1, "schema 必须是 1"
          assert meta["packageName"] == "com.hgtv.star", "包名不对"
          assert re.fullmatch(r"[0-9][0-9A-Za-z.+-]{0,63}", meta["versionName"]), "版本名不符合客户端规则"
          assert re.fullmatch(r"v[0-9][0-9A-Za-z.+-]{0,80}", meta["tag"]), "tag 不符合客户端规则"
          assert re.fullmatch(r"HGTV_[0-9][0-9A-Za-z.+-]{0,80}\.apk", meta["apk"]["name"]), "安装包名不符合客户端规则"
          assert re.fullmatch(r"[0-9a-f]{64}", meta["apk"]["sha256"]), "校验值不符合客户端规则"
          print("update.json 校验通过：", meta["versionName"], meta["versionCode"], meta["apk"]["name"])
          PY
      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.version.outputs.apk }}
          path: |
            ${{ needs.version.outputs.apk }}
            SHA256SUMS
            update.json
      - name: 写发布说明
        # 正文直接取自 docs/CHANGELOG.md 里当前版本那一节（`## <版本号>：...`），
        # 不在这里另写一套模板：改了 CHANGELOG 就等于改了发布说明，两边不会再对不上。
        # 找不到对应版本条目时该步骤失败，避免空说明。
        env:
          HGTV_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tools/release-notes.sh body > RELEASE_NOTES.md
          echo "发布说明已生成（${{ needs.version.outputs.version }}）："
          cat RELEASE_NOTES.md
