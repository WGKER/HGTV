name: Release Android TV APK

# 每次推送到 main：比较这次提交与上一次的 versionName / versionCode。
#   两个都变了 → 打包并发布 Release（tag = v<版本号>）
#   只有其中一个变 → 失败，提示必须同时改
#   都没变        → 跳过，不打包
# 手动触发时可选 force=true，跳过比对直接发布当前版本（补发失败 Release 用）。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 跳过版本比对，直接打包并发布当前版本（用于补发失败的 Release）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: 检查版本号
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.current.outputs.version }}
      code: ${{ steps.current.outputs.code }}
      apk: ${{ steps.current.outputs.apk }}
      tag: ${{ steps.current.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0            # 需要上一个提交来对比版本

      - name: 手动强制发布
        id: forced
        if: github.event_name == 'workflow_dispatch' && inputs.force
        run: echo "force=true，跳过版本比对。"

      - name: 读取当前版本
        id: current
        run: |
          set -euo pipefail
          version="$(tools/version.sh version)"
          code="$(tools/version.sh code)"
          apk="$(tools/version.sh apk)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code"       >> "$GITHUB_OUTPUT"
          echo "apk=$apk"         >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          echo "本次提交：versionName=$version versionCode=$code 产物=$apk"

      - name: 与上一个提交对比
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GRADLE_FILE: android/app/build.gradle.kts
        run: |
          set -euo pipefail
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force=true，视为版本已变动。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 上一次推送前的提交；新分支或手动触发时回落到 HEAD~1
          previous=""
          if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            previous="$BEFORE_SHA"
          elif git rev-parse --verify -q HEAD~1 >/dev/null; then
            previous="$(git rev-parse HEAD~1)"
          fi
          if [ -z "$previous" ]; then
            echo "没有可比对的历史（首次推送），视为版本已变动。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "比对基准：$previous"

          # 这个文件在历史里换过位置（早期在 kotlin-tv/ 下），逐个候选路径找出来
          old_file=""
          for candidate in "$GRADLE_FILE" "kotlin-tv/app/build.gradle.kts"; do
            if git cat-file -e "${previous}:${candidate}" 2>/dev/null; then old_file="$candidate"; break; fi
          done
          if [ -z "$old_file" ]; then
            echo "基准提交里没有找到 build.gradle.kts，视为版本已变动。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "基准文件：$old_file"
          git show "${previous}:${old_file}" > /tmp/previous-build.gradle.kts
          export HGTV_GRADLE_FILE=/tmp/previous-build.gradle.kts
          old_version="$(tools/version.sh version)"
          old_code="$(tools/version.sh code)"
          new_version="${{ steps.current.outputs.version }}"
          new_code="${{ steps.current.outputs.code }}"
          echo "基准版本：versionName=${old_version} versionCode=${old_code}"

          version_changed=false; code_changed=false
          [ "$old_version" != "$new_version" ] && version_changed=true
          [ "$old_code" != "$new_code" ] && code_changed=true

          if $version_changed && $code_changed; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif $version_changed || $code_changed; then
            echo "::error::版本号与版本 code 必须同时变动（本次 versionName ${old_version} → ${new_version}、versionCode ${old_code} → ${new_code}）"
            exit 1
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "版本未变动，跳过打包与发布。"
          fi

  release:
    name: 打包并发布
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # 创建 Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: 安装 Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: 恢复发布签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.HGTV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::缺少 secrets.HGTV_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${{ secrets.HGTV_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.HGTV_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.HGTV_KEY_PASSWORD }}"
          } > android/keystore.properties
          echo "签名配置已写入 android/keystore.properties"

      - name: 单元测试、lint、构建正式包
        run: ./android/gradlew -p android :core:test :app:lintRelease :app:assembleRelease --console=plain

      - name: 命名产物并计算校验和
        id: apk
        run: |
          set -euo pipefail
          apk="${{ needs.version.outputs.apk }}"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" | tee SHA256SUMS
          echo "name=$apk" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.version.outputs.apk }}
          path: |
            ${{ needs.version.outputs.apk }}
            SHA256SUMS

      - name: 写发布说明
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CODE: ${{ needs.version.outputs.code }}
          APK: ${{ needs.version.outputs.apk }}
        run: |
          set -euo pipefail
          {
            echo "红果TV ${VERSION}（versionCode ${CODE}）"
            echo
            echo "安装包：\`$APK\`"
            echo "校验：\`SHA256SUMS\`（\`sha256sum -c SHA256SUMS\`）"
            echo
            echo "最低 Android 8.0 / API 26，沿用同一发布签名，可覆盖安装并保留本机记录。"
          } > RELEASE_NOTES.md

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          APK: ${{ needs.version.outputs.apk }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在，请再升一次版本号"
            exit 1
          fi
          gh release create "$TAG" "$APK" SHA256SUMS \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md
